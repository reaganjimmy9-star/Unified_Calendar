<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unified Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <style>
      :root{
        --surface:#fff;
        --border:#eee;
        --text:#111;
        --muted:#666;
      }
      body{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin:0; color:var(--text); background:var(--surface);
      }
      header{
        padding:12px 16px; border-bottom:1px solid var(--border);
        display:flex; gap:12px; align-items:center;
      }
      #calendar{ max-width:1100px; margin:24px auto; padding:0 16px; }

      /* Legend */
      .legend{ margin-left:auto; display:flex; gap:14px; align-items:center; font-size:14px; color:var(--muted);}
      .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:6px; }

      /* Event chip polish (uses color provided by server) */
      .fc .fc-daygrid-event{
        border-radius:8px; padding:2px 6px;
      }
      .fc .fc-daygrid-event .fc-event-title{
        font-weight:600; font-size:12px;
      }

      /* Simple tooltip on hover (uses title attribute we set) */
      .fc .fc-daygrid-event:hover{
        filter:brightness(0.95);
      }
      .fc .fc-daygrid-event[title]{
        position:relative;
      }
      .fc .fc-daygrid-event[title]:hover::after{
        content:attr(title);
        position:absolute; z-index:10; left:0; top:100%;
        margin-top:6px; white-space:pre-wrap; max-width:280px;
        background:#111; color:#fff; padding:8px 10px; border-radius:8px;
        box-shadow:0 6px 18px rgba(0,0,0,.2); font-size:12px; line-height:1.25;
      }

      /* Today pill */
      .fc .fc-day-today{ background:rgba(26,115,232,0.06); }
    </style>
  </head>
  <body>
    <header>
      <h3 style="margin:0">Unified Calendar (read-only)</h3>
      <div class="legend">
        <span><span class="dot" style="background:#1a73e8"></span>Google</span>
        <span><span class="dot" style="background:#d93025"></span>Canvas</span>
      </div>
    </header>

    <div id="calendar"></div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const el = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(el, {
          initialView: 'dayGridMonth',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
          },
          nowIndicator: true,
          navLinks: true,
          editable: false,
          selectable: false,

          // Keep EXACTLY the same backend call you had before (no params).
          events: async function(fetchInfo, successCb, failureCb) {
            try {
              const res = await fetch('/api/events');
              if (!res.ok) throw new Error('HTTP ' + res.status);
              const data = await res.json();

              // Add a nicer tooltip text that shows source/location/description
              const withTitles = (Array.isArray(data) ? data : []).map(e => {
                const p = e.extendedProps || {};
                const lines = [e.title || ''];
                if (p.source)     lines.push(`Source: ${p.source}`);
                if (p.location)   lines.push(`Location: ${p.location}`);
                if (p.description)lines.push('', p.description);
                // FullCalendar uses the 'title' attribute on the element for tooltips we defined in CSS
                e.titleAttr = lines.join('\n');
                return e;
              });
              successCb(withTitles);
            } catch (err) {
              failureCb(err);
            }
          },

          eventDidMount: (arg) => {
            // Preserve your old behavior: show source in the native title tooltip too
            if (arg.event.extendedProps?.source) {
              arg.el.title = `[${arg.event.extendedProps.source}] ${arg.event.title}\n` + (arg.el.title || '');
            }
            // Also support our custom tooltip content if provided by events() above
            if (arg.event.extendedProps || arg.event.title) {
              if (arg.event._def?.extendedProps && arg.event._def.extendedProps.titleAttr) {
                arg.el.setAttribute('title', arg.event._def.extendedProps.titleAttr);
              }
            }
          },
        });

        calendar.render();
      });
    </script>
  </body>
</html>
