<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Unified Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"/>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
      header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid #eee; }
      .brand { font-weight:600; }
      .filters { display:flex; gap:8px; }
      #calendar { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
      button{padding:10px 14px; border:0; border-radius:10px; cursor:pointer}
      .btn{background:#1a73e8; color:#fff}
      .btn.sec{background:#eee; color:#111}
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Unified Calendar</div>
      <div class="filters">
        <select id="sourceSel">
          <option value="both">Google + Canvas</option>
          <option value="google">Google only</option>
          <option value="canvas">Canvas only</option>
        </select>
        <button id="refreshBtn" class="btn sec">Refresh</button>

        <!-- Auth actions (toggle via JS) -->
        <a id="signinBtn" href="/auth/google/start?next=/" class="btn sec" style="display:none;text-decoration:none;line-height:32px;padding:8px 12px;border-radius:10px">Sign in</a>
        <form id="signoutForm" method="POST" action="/auth/signout" style="display:none">
          <button type="submit" class="btn sec">Sign out</button>
        </form>
      </div>
    </header>

    <div id="calendar"></div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script>
      const sourceSel  = document.getElementById('sourceSel');
      const refreshBtn = document.getElementById('refreshBtn');

      async function updateAuthButtons() {
        try {
          const s = await fetch('/me/status').then(r => r.json());
          const inBtn  = document.getElementById('signinBtn');
          const outForm= document.getElementById('signoutForm');
          if (s.google_connected) { inBtn.style.display='none'; outForm.style.display='inline'; }
          else { inBtn.style.display='inline-block'; outForm.style.display='none'; }
        } catch {
          document.getElementById('signinBtn').style.display='inline-block';
          document.getElementById('signoutForm').style.display='none';
        }
      }

      // Calendar (this page is only served when "ready" by the server)
      let calendarRef;
      document.addEventListener('DOMContentLoaded', async function() {
        await updateAuthButtons();

        const el = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(el, {
          initialView: 'dayGridMonth',
          height: 'auto',
          events: (info, success, failure) => {
            const src = sourceSel.value;
            const url = `/api/events?source=${encodeURIComponent(src)}&after=${info.startStr}T00:00:00&before=${info.endStr}T00:00:00`;
            fetch(url).then(r => r.json()).then(data => {
              // if backend ever returns not_configured (edge case), go to /setup
              if (data && data.error === 'not_configured') {
                window.location.href = '/setup';
                return;
              }
              if (Array.isArray(data)) success(data); else failure(new Error('Bad events payload'));
            }).catch(failure);
          },
          eventDidMount: (arg) => {
            if (arg.event.extendedProps?.source) {
              arg.el.title = `[${arg.event.extendedProps.source}] ${arg.event.title}`;
            }
          }
        });
        calendar.render();
        calendarRef = calendar;

        sourceSel.onchange = () => calendar.refetchEvents();
        refreshBtn.onclick = () => calendar.refetchEvents();
      });

      // After returning from OAuth, refresh header state
      window.addEventListener('focus', updateAuthButtons);
    </script>
  </body>
</html>
