<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unified Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet" />
    <style>
      /* FullCalendar will respect this when height:'parent' */
      #calendar { height: var(--cal-h, auto); }
      /* Buttons in header */
      .signout-btn{
        padding:8px 10px;border:1px solid var(--border);border-radius:10px;
        background:var(--surface-2);color:var(--text);text-decoration:none;font-size:13px
      }
      .signout-btn:hover{filter:brightness(.96)}
      .signout-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

      /* Make the calendar area breathe on tall/wide screens */
      #wrap{
        /* already has max-width / margins; add these: */
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto; /* space for states without pushing calendar */
      }

      :root{
        --surface:#fff; --surface-2:#fafafa; --border:#eaeaea; --text:#111; --muted:#666;
        --blue:#1a73e8; --red:#d93025; --shadow:0 10px 30px rgba(0,0,0,.06);
      }
      html[data-theme="dark"]{
        --surface:#0f1115; --surface-2:#11141a; --border:#20242c; --text:#f5f7fb; --muted:#a4adbb;
        --shadow:0 10px 30px rgba(0,0,0,.4);
      }

      html,body{height:100%}
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;color:var(--text);background:var(--surface)}

      header{
        position:sticky;top:0;z-index:100;padding:12px 16px;border-bottom:1px solid var(--border);
        display:flex;gap:12px;align-items:center;background:var(--surface);backdrop-filter:saturate(180%) blur(8px);
      }
      header h3{margin:0;font-size:16px;font-weight:700}

      /* Container */
      #wrap{max-width:clamp(1100px,92vw,1600px);margin:20px auto 28px;padding:0 16px}

      /* Calendar card */
      #calendar{
        box-shadow:var(--shadow);border-radius:14px;overflow:hidden;border:1px solid var(--border)
      }
      #calendar .fc{background:var(--surface)}
      #calendar .fc .fc-scrollgrid{background:var(--surface);border-radius:14px}

      .legend{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted)}
      .dot{width:10px;height:10px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:6px}
      .theme-toggle{margin-left:8px;display:inline-flex;align-items:center;gap:8px}
      .theme-btn{padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);cursor:pointer;font-size:13px}

      .fc .fc-daygrid-event{border-radius:9px;padding:2px 6px}
      .fc .fc-daygrid-event .fc-event-title{font-weight:600;font-size:12px}
      .fc .fc-daygrid-event:hover{filter:brightness(0.95)}

      .fc .fc-day-today{background:rgba(26,115,232,0.06)}

      #loading{display:none;margin:22px auto;max-width:1100px;padding:0 16px}
      .skeleton{height:420px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:shimmer 1.1s infinite linear;box-shadow:var(--shadow)}
      @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

      .state{display:none;margin:16px auto 0;max-width:640px;text-align:center;color:var(--muted)}
      .state h4{margin:10px 0 6px;color:var(--text)}
      .state p{margin:6px 0 12px}
      .state button{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);cursor:pointer}

      .fc .fc-toolbar.fc-header-toolbar{padding:10px 12px}

      @media (min-width:1400px){
        .fc .fc-toolbar-title{font-size:1.6rem}
        .fc .fc-button{padding:.5rem .75rem}
      }

      @media (max-width: 640px){
        /* Smaller controls/title */
        .fc .fc-toolbar-title{ font-size: 1.1rem; }
        .fc .fc-button{ padding: .35rem .5rem; }

        /* Denser month cells */
        .fc .fc-daygrid-day-frame{ padding: 1px 2px !important; }
        .fc .fc-daygrid-event{
          padding: 0 4px !important;   /* was 2px 6px */
          border-radius: 8px !important;
          line-height: 1.1 !important;
        }
        /* Kill the lead dot completely */
        .fc .fc-daygrid-event-dot{ display:none !important; }
        .fc .fc-daygrid-event .fc-event-title{
          font-size:10px;
          font-weight:600;
          white-space:nowrap; overflow:hidden; text-overflow:clip;
          mask-image: linear-gradient(to right, black 90%, transparent 100%);
          -webkit-mask-image: linear-gradient(to right, black 90%, transparent 100%);
          display: block;
          max-width:100%;
        }
        /* smaller day number + less padding in cells */
        .fc .fc-daygrid-day-number{
          font-size: 11px !important;
          padding: 2px 4px !important;
        }
        /* tighten event chips a touch */
        /* Compact the FullCalendar header toolbar */
        .fc .fc-toolbar.fc-header-toolbar {
          padding: 6px 8px !important;
          gap: 4px !important;
        }

        /* Make the "prev" / "next" arrows smaller and closer */
        .fc .fc-prev-button,
        .fc .fc-next-button {
          padding: 2px 6px !important;
          font-size: 0.8rem !important;
          line-height: 1.2 !important;
          min-width: 26px !important;
        }

        /* Reduce space between arrows and title */
        .fc .fc-toolbar-title {
          font-size: 1rem !important;
          margin: 0 4px !important;
        }

        /* Compress the view-selector buttons ("month/week/day/list") */
        .fc .fc-button-group .fc-button {
          padding: 3px 6px !important;
          font-size: 0.75rem !important;
        }

        /* Make the whole toolbar flex more naturally */
        .fc .fc-toolbar.fc-header-toolbar {
          flex-wrap: wrap;
          justify-content: space-between;
        }
      }

      @media print{
        header,.legend{display:none!important}
        #wrap{margin:0;padding:0}
        #calendar{box-shadow:none;border-radius:0;border:0}
      }

      html[data-theme="dark"] .fc-theme-standard td,
      html[data-theme="dark"] .fc-theme-standard th{border-color:var(--border)}
      html[data-theme="dark"] .fc .fc-col-header-cell{background:var(--surface-2)}
      html[data-theme="dark"] .fc .fc-col-header-cell-cushion{color:var(--text)}
      html[data-theme="dark"] .fc .fc-daygrid-day{background:var(--surface)}
      html[data-theme="dark"] .fc .fc-daygrid-day-number{color:var(--muted)}
      html[data-theme="dark"] .fc .fc-day-today{background:rgba(26,115,232,0.14)}
      html[data-theme="dark"] .fc .fc-list{background:var(--surface)}
      html[data-theme="dark"] .fc .fc-list-day-cushion{background:var(--surface-2);color:var(--text)}
      .fc .fc-scrollgrid{border:0!important}

      /* timeGrid dark fixes */
      html[data-theme="dark"] .fc .fc-col-header-cell.fc-day-today{background:color-mix(in srgb,var(--blue) 15%,var(--surface-2));color:var(--text)}
      html[data-theme="dark"] .fc .fc-timegrid-col,
      html[data-theme="dark"] .fc .fc-timegrid-allday{background:var(--surface)}
      html[data-theme="dark"] .fc .fc-timegrid-col.fc-day-today,
      html[data-theme="dark"] .fc .fc-timegrid-col.fc-day-today .fc-timegrid-col-frame{background:var(--surface-2)}
      html[data-theme="dark"] .fc .fc-timegrid-axis,
      html[data-theme="dark"] .fc .fc-timegrid-divider{background:var(--border)}
      html[data-theme="dark"] .fc .fc-timegrid-now-indicator-line{border-color:var(--blue)}

      html[data-theme="dark"] .fc .fc-timegrid-axis,
      html[data-theme="dark"] .fc .fc-timegrid-axis-frame,
      html[data-theme="dark"] .fc .fc-timegrid-axis-cushion{background:var(--surface-2);color:var(--muted)}
      html[data-theme="dark"] .fc .fc-timegrid .fc-scrollgrid-section-header .fc-timegrid-axis,
      html[data-theme="dark"] .fc .fc-timegrid .fc-scrollgrid-section-header .fc-timegrid-axis-frame{background:var(--surface-2)}
      html[data-theme="dark"] .fc .fc-timegrid .fc-daygrid,
      html[data-theme="dark"] .fc .fc-timegrid .fc-daygrid-body,
      html[data-theme="dark"] .fc .fc-timegrid .fc-daygrid-day,
      html[data-theme="dark"] .fc .fc-timegrid .fc-daygrid-day-frame{background:var(--surface-2)!important}
      html[data-theme="dark"] .fc .fc-timegrid-body,
      html[data-theme="dark"] .fc .fc-timegrid-slots{background:var(--surface)}
      html[data-theme="dark"] .fc .fc-timegrid-divider,
      html[data-theme="dark"] .fc .fc-timegrid-slot,
      html[data-theme="dark"] .fc-theme-standard .fc-timegrid-slot{border-color:var(--border)}
      html[data-theme="dark"] .fc .fc-timegrid-col.fc-day-today{background:color-mix(in srgb,var(--blue) 10%,transparent)}

      /* timeGrid: bring back vertical day borders in dark mode */
      html[data-theme="dark"] .fc .fc-timegrid-cols .fc-timegrid-col {
        border-left: 1px solid var(--border);
      }
      html[data-theme="dark"] .fc .fc-timegrid-cols .fc-timegrid-col:first-child {
        border-left: 0;
      }
      html[data-theme="dark"] .fc .fc-timegrid-cols {
        border-right: 1px solid var(--border);
      }
      /* List view: dark-mode hover/focus colors */
      html[data-theme="dark"] .fc {
        /* If FC reads CSS vars, this alone may fix it */
        --fc-list-event-hover-bg-color: rgba(255,255,255,0.06);
      }
      /* Soften list borders in dark mode */
      html[data-theme="dark"] .fc .fc-list-table,
      html[data-theme="dark"] .fc .fc-list-day,
      html[data-theme="dark"] .fc .fc-list-event td,
      html[data-theme="dark"] .fc .fc-list-event {
        border-color: var(--border) !important;
      }

      /* Optional: dim the day headers a bit so they blend with other cells */
      html[data-theme="dark"] .fc .fc-list-day-cushion {
        background: var(--surface-2) !important;
        border-bottom: 1px solid var(--border) !important;
      }
      /* List view: make the outer table/frame borders match our dark border */
      html[data-theme="dark"] .fc {
        --fc-border-color: var(--border);           /* key: table outline color */
      }

      html[data-theme="dark"] .fc .fc-list,
      html[data-theme="dark"] .fc .fc-list-table {
        border-color: var(--border) !important;     /* belt & suspenders */
      }

      /* Optional: soften the sticky day header edge too */
      html[data-theme="dark"] .fc .fc-list-sticky .fc-list-day > * {
        border-color: var(--border) !important;
      }


      html[data-theme="dark"] .fc .fc-list-event:hover td,
      html[data-theme="dark"] .fc .fc-list-event:focus-within td {
        background: rgba(255,255,255,0.06) !important; /* soft dark hover */
        color: var(--text) !important;
      }
      /* Ensure links and dots don't flip to low-contrast colors */
      html[data-theme="dark"] .fc .fc-list-event-title a { color: var(--text) !important; }
      html[data-theme="dark"] .fc .fc-list-event-dot { border-color: currentColor; }
      /* ensure the "today" column doesn't hide the borders */
      html[data-theme="dark"] .fc .fc-timegrid-col.fc-day-today {
        box-shadow: inset 1px 0 0 var(--border), inset -1px 0 0 var(--border);
      }
      /* optional: slightly brighten horizontal slot lines */
      html[data-theme="dark"] .fc-theme-standard .fc-timegrid-slot {
        border-top-color: var(--border);
      }
    </style>
  </head>
  <body>
    <header>
      <h3>Unified Calendar (read-only)</h3>
      <div class="legend" aria-hidden="true">
        <span><span class="dot" style="background:#1a73e8"></span>Google</span>
        <span><span class="dot" style="background:#d93025"></span>Canvas</span>
      </div>
      <div class="theme-toggle" title="Switch theme">
        <button id="themeBtn" class="theme-btn" type="button" aria-pressed="false">🌞 Light</button>
        <a href="/logout" class="signout-btn" aria-label="Sign out">Sign out</a>
      </div>
    </header>

    <div id="wrap">
      <div id="loading" aria-live="polite" aria-busy="true">
        <div class="skeleton" role="status" aria-label="Loading calendar"></div>
      </div>

      <div id="calendar" aria-live="polite"></div>

      <div id="empty" class="state" role="status" aria-live="polite">
        <h4>No events in this range</h4>
        <p>Try switching views or navigating to another date.</p>
        <button type="button" id="reloadBtn">Reload</button>
      </div>

      <div id="error" class="state" role="alert">
        <h4>Couldn’t load events</h4>
        <p>Check your connection or try again.</p>
        <button type="button" id="retryBtn">Try again</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script>
      (function () {
        function setCalHeightToViewport() {
          const header = document.querySelector('header');
          const pad = 32; // bottom breathing room
          const hAvail = Math.max(420, window.innerHeight - (header?.offsetHeight || 0) - pad);
          document.getElementById('calendar').style.setProperty('--cal-h', `${hAvail}px`);
          if (window.calendar) {
            requestAnimationFrame(() => window.calendar.updateSize());
          }
        }
        function isoWithTZ(d) {
          // Formats like 2025-11-01T00:00:00-04:00 (no 'Z')
          const pad = n => String(n).padStart(2, '0');
          const off = -d.getTimezoneOffset();          // minutes
          const sign = off >= 0 ? '+' : '-';
          const hh = pad(Math.floor(Math.abs(off) / 60));
          const mm = pad(Math.abs(off) % 60);
          return (
            d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + 'T' +
            pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) +
            sign + hh + ':' + mm
          );
        }
        function boot() {
          try {
            const html = document.documentElement;
            const themeBtn = document.getElementById('themeBtn');
            const saved = localStorage.getItem('ucc_theme');
            applyTheme(saved === 'dark' ? 'dark' : 'light');

            function applyTheme(mode){
              if(mode==='dark'){
                html.setAttribute('data-theme','dark');
                themeBtn.textContent='🌙 Dark';
                themeBtn.setAttribute('aria-pressed','true');
              }else{
                html.setAttribute('data-theme','light');
                themeBtn.textContent='🌞 Light';
                themeBtn.setAttribute('aria-pressed','false');
              }
              localStorage.setItem('ucc_theme',mode);
              themeBtn.setAttribute('aria-label', mode === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            }
            themeBtn.addEventListener('click', () => {
              const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
              applyTheme(next);
              // Recompute AR after header/theme changes
              if (window.calendar) {
                window.calendar.setOption('aspectRatio', pickAR());
                setCalHeightToViewport();
              }
            });

            const calEl = document.getElementById('calendar');
            if(!calEl){ console.error('[UCC] #calendar not found'); return; }

            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('empty');
            const errorState = document.getElementById('error');
            const reloadBtn = document.getElementById('reloadBtn');
            const retryBtn  = document.getElementById('retryBtn');

            const show = el => el && (el.style.display='block');
            const hide = el => el && (el.style.display='none');

            const narrow = window.matchMedia('(max-width: 640px)').matches;
            let currentView = narrow ? 'listWeek' : 'dayGridMonth';

            // --- Responsive aspect ratio helper (height-aware) ---
            function pickAR(){
              const wrap = document.getElementById('wrap');
              const header = document.querySelector('header');
              const w = wrap?.clientWidth || window.innerWidth;
              const hAvail = Math.max(
                420,
                (window.innerHeight - (header?.offsetHeight || 0) - 32) // some bottom margin
              );

              // Base target by width (keeps your existing feel)
              let target;
              if (w >= 1920) target = 1.15;  // tall-ish cells on ultrawide
              else if (w >= 1440) target = 1.25;
              else if (w >= 1024) target = 1.32;
              else target = 1.2;

              // Height clamp: don't let AR be so wide that we get bottom whitespace
              const heightBound = w / hAvail;               // AR = width / height
              // Keep AR at least the width-based target (prevents "too tall" after shrink),
              // but still cap it if height is limited.
              const ar = Math.max(target, Math.min(1.8, heightBound + 0.05));
              return Number(ar.toFixed(2));
            }
            let currentAR = pickAR();

            const CACHE_VERSION = 4;

            const eventCache = new Map();

            function monthKeysForRange(start, end) {
              const k = [];
              const d = new Date(start.getFullYear(), start.getMonth(), 1);
              while (d <= end) {
                k.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
                d.setMonth(d.getMonth()+1);
              }
              return k;
            }


            const calendar = new FullCalendar.Calendar(calEl, {
              initialView: currentView,
              headerToolbar: { left:'prev,next today', center:'title', right:'dayGridMonth,timeGridWeek,timeGridDay,listWeek' },
              nowIndicator: true,
              navLinks: true,
              editable: false,
              selectable: false,
              eventTimeFormat: { hour:'2-digit', minute:'2-digit', hour12:true },
              displayEventTime: true,
              expandRows: true,
              aspectRatio: currentAR,
              height: 'parent',
              timeZone: 'local',                    // render using the device’s local zone
              moreLinkClick: 'popover',

              views: {
                dayGridMonth: { dayMaxEventRows: true }   // enable “+N more”
              },
              datesSet(info){
                const isMonth  = info.view.type === 'dayGridMonth';
                const isMobile = window.matchMedia('(max-width: 640px)').matches;

                calendar.setOption('dayMaxEventRows', isMobile && isMonth ? 6 : true);
                calendar.setOption('displayEventTime', !isMonth); // hide “7:00 PM …”
                calendar.setOption('eventDisplay', isMobile && isMonth ? 'block' : 'auto');

                // Make boxes a bit flatter on phones so events fit better
                // (raise AR only for narrow; adjust your pickAR() if you prefer)
                if (isMobile && isMonth) {
                  const ar = Math.max(1.35, pickAR()); // ~flatter than desktop
                  if (ar !== currentAR){
                    currentAR = ar;
                    calendar.setOption('aspectRatio', currentAR);
                    requestAnimationFrame(() => calendar.updateSize());
                  }
                }
              },



              events: async function (fetchInfo, successCb, failureCb) {
                try {
                  hide(emptyState);
                  hide(errorState);

                  // widen by ±30d to reduce refetching on next/prev
                  const widen = (d, days) => new Date(d.getTime() + days * 864e5);
                  const after  = isoWithTZ(widen(fetchInfo.start, -30));
                  const before = isoWithTZ(widen(fetchInfo.end,   30));

                  // serve from cache if all months are present
                  const viewKeys  = monthKeysForRange(fetchInfo.start, fetchInfo.end);
                  const allCached = viewKeys.every(k => eventCache.has(k));
                  if (allCached) {
                    const merged = viewKeys.flatMap(k => eventCache.get(k));
                    successCb(merged);
                    hide(emptyState);
                    return;
                  }

                  const url = `/api/events?after=${encodeURIComponent(after)}&before=${encodeURIComponent(before)}`;
                  const res = await fetch(url, { cache: 'no-store' });
                  if (!res.ok) throw new Error('HTTP ' + res.status);
                  const raw = await res.json();
                  const data = Array.isArray(raw) ? raw : [];

                  let mapped = data;

                  // optional: color pills on mobile month view
                  const isMobile = window.matchMedia('(max-width: 640px)').matches;
                  const isMonth  = calendar.view?.type === 'dayGridMonth';
                  if (isMobile && isMonth) {
                    mapped = mapped.map(e => e.color ? {
                      ...e,
                      backgroundColor: e.color,
                      borderColor: e.color,
                      textColor: '#fff',
                      color: undefined
                    } : e);
                  }

                  // rebuild cache by month (only current cache version)
                  const byMonth = new Map();
                  for (const e of mapped) {
                    const s = new Date(e.start);
                    const key = `${s.getFullYear()}-${String(s.getMonth() + 1).padStart(2, '0')}`;
                    if (!byMonth.has(key)) byMonth.set(key, []);
                    byMonth.get(key).push(e);
                  }
                  for (const [k, arr] of byMonth) eventCache.set(k, arr);

                  // respond with just the months in view
                  const payload = viewKeys.flatMap(k => (eventCache.get(k) || []));
                  successCb(payload);
                  if (payload.length === 0) show(emptyState); else hide(emptyState);

                } catch (err) {
                  console.error('[UCC] events fetch failed:', err);
                  failureCb(err);
                  show(errorState);
                } finally {
                  hide(loading);
                }
              },

              eventDidMount(arg) {
                const isMobile = window.matchMedia('(max-width: 640px)').matches;
                const isMonth  = calendar.view.type === 'dayGridMonth';
                if (isMobile && isMonth) {
                  const el = arg.el.querySelector('.fc-event-title');
                  if (el) el.textContent = (el.textContent || '').replace(/\s*\[.*$/, '');
                }
                // Remove bracketed suffixes like " ... [ECE-301]" to save space
                const titleEl = arg.el.querySelector('.fc-event-title');
                if (titleEl) {
                  titleEl.textContent = (titleEl.textContent || '').replace(/\s*\[.*$/, '');
                }
              },

              eventClick: function(info){
                const p = info.event.extendedProps || {};
                const lines = [info.event.title || '(no title)'];
                if(p.source)      lines.push(`Source: ${p.source}`);
                if(p.location)    lines.push(`Location: ${p.location}`);
                if(p.description) lines.push('', p.description);
                alert(lines.join('\n'));
              }
            });

            if (!window.__cv || window.__cv !== CACHE_VERSION) {
              eventCache.clear();
              window.__cv = CACHE_VERSION;
            }

            calendar.render();
            window.calendar = calendar;
            setCalHeightToViewport();


            // Resize handler: switch view at 640px AND update aspect ratio
            let lastNarrow = narrow;
            window.addEventListener('resize', () => {
              const isMobile = window.matchMedia('(max-width: 640px)').matches;
              if(isMobile !== lastNarrow){
                calendar.changeView(isMobile ? 'listWeek' : 'dayGridMonth');
                lastNarrow = isMobile;
              }
              const nextAR = pickAR();
              if(nextAR !== currentAR){
                currentAR = nextAR;
                calendar.setOption('aspectRatio', currentAR);
                // ensure FC recomputes sizes after AR change
                requestAnimationFrame(() => calendar.updateSize());
              }
              setCalHeightToViewport();
            }, { passive:true });

            retryBtn?.addEventListener('click', () => { hide(errorState); calendar.refetchEvents(); });
            reloadBtn?.addEventListener('click', () => { calendar.refetchEvents(); });

            // --- Add this right here ---
            const ro = new ResizeObserver(() => {
              const nextAR = pickAR();
              if (nextAR !== currentAR) {
                currentAR = nextAR;
                calendar.setOption('aspectRatio', currentAR);
                // ensure FC recomputes sizes after AR change
                requestAnimationFrame(() => calendar.updateSize());
              }
              setCalHeightToViewport();
            });
            ro.observe(document.getElementById('wrap'));
            ro.observe(document.querySelector('header'));

          } catch(e){
            console.error('[UCC] init error:', e);
          }
        }

        if(window.FullCalendar && window.FullCalendar.Calendar){
          document.addEventListener('DOMContentLoaded', boot);
        }else{
          window.addEventListener('load', boot);
        }
      })();
    </script>
  </body>
</html>
